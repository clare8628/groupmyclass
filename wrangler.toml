name = "groupmyclass"
main = "src/index.js"
compatibility_date = "2026-09-02"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "groupmyclass"
database_id = "ffb52212-2ce5-4335-a9d3-6cf70e43a732"

# "0 19 * * *"  每日 03:00（台北）清除超過六個月的點名／問卷異動紀錄
# "*/5 * * * *" 每 5 分鐘比對課表，命中「第一節上課時間＋提醒延遲」即發送點名自動提醒
# （每分鐘觸發太頻繁、對判斷精度無實質幫助；5 分鐘可將 Worker 調用次數降至 1/5，
#   提醒最多延後 5 分鐘內送出，並以 attendance_reminder_runs 保證當天只送一次，不會漏送或重送）
[triggers]
crons = ["0 19 * * *", "*/5 * * * *"]
